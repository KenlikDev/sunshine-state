name: Repository checks

on:
  pull_request:
  push:
    branches:
      - develop
      - main
      - "codex/**"
  workflow_dispatch:
    inputs:
      run_living_district_soak:
        description: "Run the 15-minute living-district stability test"
        type: boolean
        required: true
        default: false

jobs:
  docs-and-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required project documents
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            README.md \
            docs/vision.md \
            docs/mvp-scope.md \
            docs/architecture.md \
            docs/gameplay-systems.md \
            docs/art-pipeline.md \
            docs/testing-strategy.md \
            docs/performance-budgets.md \
            docs/source-register.md \
            docs/roadmap.md \
            docs/development-workflow.md \
            docs/vertical-slice.md \
            docs/vehicle-system.md \
            docs/living-district.md \
            docs/wanted-system.md \
            docs/combat-system.md \
            docs/progression-system.md \
            scripts/systems/economy_service.gd \
            scripts/systems/mission_service.gd \
            scripts/systems/save_service.gd \
            scripts/gameplay/shop_interactable.gd \
            data/items/items.json \
            data/missions/missions.json \
            scenes/economy/shop_interactable.tscn \
            tests/test_progression_system.gd \
            tests/test_progression_system.tscn \
            scripts/gameplay/damageable.gd \
            scripts/gameplay/weapon_controller.gd \
            tests/test_combat_system.gd \
            tests/test_combat_system.tscn \
            scripts/gameplay/wanted_system.gd \
            scripts/gameplay/police_controller.gd \
            scripts/gameplay/crime_interactable.gd \
            scenes/police/police_officer.tscn \
            scenes/crime/graffiti_spot.tscn \
            tests/test_wanted_system.gd \
            tests/test_wanted_system.tscn \
            scripts/gameplay/pedestrian_controller.gd \
            scripts/gameplay/traffic_controller.gd \
            scenes/pedestrians/pedestrian.tscn \
            scenes/traffic/traffic_vehicle.tscn \
            tests/test_living_district.gd \
            tests/test_living_district.tscn \
            tests/living_district_soak.gd \
            tests/living_district_soak.tscn \
            scenes/vehicles/compact.tscn \
            scenes/vehicles/pickup.tscn \
            localization/ui.csv \
            scripts/ui/localization_service.gd \
            tests/test_vertical_slice.gd \
            tests/test_vertical_slice.tscn \
            tests/test_vehicle_system.gd \
            tests/test_vehicle_system.tscn
          do
            test -s "$file" || { echo "Missing or empty required file: $file"; exit 1; }
          done

      - name: Check changed lines for whitespace errors
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            git diff --check "origin/$GITHUB_BASE_REF...HEAD"
          elif git rev-parse --verify HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD
          else
            git diff --check
          fi

  godot-smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Godot version
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Report engine version
        run: godot --version

      - name: Import and validate project resources
        run: godot --headless --editor --path . --quit

      - name: Launch main scene headlessly
        run: godot --headless --path . --quit-after 2

      - name: Run vertical-slice regression checks
        run: godot --headless --path . res://tests/test_vertical_slice.tscn

      - name: Run vehicle-system regression checks
        run: godot --headless --path . res://tests/test_vehicle_system.tscn

      - name: Run living-district regression checks
        run: godot --headless --path . res://tests/test_living_district.tscn

      - name: Run wanted-system regression checks
        run: godot --headless --path . res://tests/test_wanted_system.tscn

      - name: Run combat-system regression checks
        run: timeout 45s godot --headless --path . res://tests/test_combat_system.tscn

      - name: Run progression-system regression checks
        run: timeout 45s godot --headless --path . res://tests/test_progression_system.tscn

  living-district-soak:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_living_district_soak }}
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pinned Godot version
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Run 15-minute living-district soak test
        run: godot --headless --path . res://tests/living_district_soak.tscn
